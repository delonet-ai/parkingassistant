#
# Immich stack for Portainer Git deployment.
# Based on the official Immich release compose:
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#

name: immich

x-immich-common-env: &immich-common-env
  DB_HOSTNAME: database
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
  REDIS_HOSTNAME: redis
  TZ: ${TZ:-Europe/Moscow}

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION:-/docker/appdata/immich/library}:/data
      - /etc/localtime:/etc/localtime:ro
      - /srv/Archive/Sorted:/external/Sorted:ro
      - /srv/Archive/Файлы без источника:/external/Files_without_source:ro
      - /srv/Archive/Olya_all:/external/Olya_all:ro
    environment:
      <<: *immich-common-env
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    environment:
      TZ: ${TZ:-Europe/Moscow}
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${DB_DATA_LOCATION:-/docker/appdata/immich/postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
